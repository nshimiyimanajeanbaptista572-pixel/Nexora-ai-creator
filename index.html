
<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101124">
  <title>Nexora AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #f8fafc;
      background: linear-gradient(145deg, #101124, #19254a);
    }
    header {
      padding: 22px 16px;
      border-bottom: 1px solid #343858;
      text-align: center;
    }
    header h1 { margin: 0; color: #a5b4fc; font-size: 30px; }
    header p { color: #cbd5e1; margin-bottom: 0; }
    main {
      max-width: 760px;
      margin: 35px auto;
      padding: 20px;
    }
    .panel {
      padding: 22px;
      border: 1px solid #41476c;
      border-radius: 18px;
      background: rgba(20, 25, 53, .9);
    }
    h2 { margin-top: 0; }
    label { display: block; margin: 18px 0 8px; }
    textarea {
      display: block;
      width: 100%;
      min-height: 130px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #596185;
      border-radius: 12px;
      background: #10152e;
      color: white;
      font: inherit;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #818cf8;
      color: #11132b;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #status { color: #cbd5e1; }
    #answer {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }
    .result {
      margin-top: 22px;
      padding: 18px;
      border-radius: 12px;
      background: #10152e;
      min-height: 70px;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #b9c1dc;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>✦ Nexora AI</h1>
    <p>Ibitekerezo byawe. Ubwenge bw'ubukorano.</p>
  </header>

  <main>
    <section class="panel">
      <h2>Murakaza neza kuri Nexora AI!</h2>
      <p>Andika ikibazo cyangwa igitekerezo ushaka ko AI igufashamo.</p>

      <form id="aiForm">
        <label for="prompt">Andika ikibazo cyawe:</label>
        <textarea
          id="prompt"
          maxlength="5000"
          placeholder="Urugero: Mpa igitekerezo cya video isekeje..."
          required
        ></textarea>
        <button id="sendBtn" type="submit">Baza Nexora AI ✨</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>

      <section class="result" aria-label="Igisubizo cya AI">
        <h3>Igisubizo</h3>
        <div id="answer">Igisubizo cya AI kizagaragara hano.</div>
      </section>
    </section>
  </main>

  <footer>© 2026 Nexora AI</footer>

  <script>
    const form = document.getElementById("aiForm");
    const promptInput = document.getElementById("prompt");
    const sendBtn = document.getElementById("sendBtn");
    const statusText = document.getElementById("status");
    const answerBox = document.getElementById("answer");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const prompt = promptInput.value.trim();

      if (!prompt) {
        statusText.textContent = "Banza wandike ikibazo.";
        return;
      }

      sendBtn.disabled = true;
      statusText.textContent = "Nexora AI iri gutekereza...";
      answerBox.textContent = "";

      try {
        const response = await fetch("/.netlify/functions/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt: prompt })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Habaye ikibazo. Ongera ugerageze.");
        }

        answerBox.textContent = data.text || "Nta gisubizo cyabonetse.";
        statusText.textContent = "Igisubizo cyabonetse!";
      } catch (error) {
        answerBox.textContent = "Ntabwo tubashije kubona igisubizo.";
        statusText.textContent =
          error.message || "Reba internet yawe wongere ugerageze.";
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
