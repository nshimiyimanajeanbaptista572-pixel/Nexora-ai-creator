<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b18">
  <title>Nexora AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090b18;
      color: #f5f5ff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 20px;
      border-bottom: 1px solid #24263b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 21px;
      font-weight: bold;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 23px;
      background: linear-gradient(135deg, #7c4dff, #00d4ff);
    }

    .status {
      font-size: 12px;
      color: #8ce9bc;
      border: 1px solid #24563f;
      border-radius: 20px;
      padding: 7px 10px;
    }

    main {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 30px 18px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .welcome {
      text-align: center;
      margin: 35px 0 30px;
    }

    .welcome h1 {
      font-size: clamp(29px, 6vw, 43px);
      margin: 0 0 14px;
      background: linear-gradient(90deg, #b69aff, #5ce5ff);
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
    }

    .welcome p {
      color: #a8abc5;
      line-height: 1.7;
      font-size: 15px;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }

    .suggestion {
      background: #121529;
      border: 1px solid #292d49;
      color: #e8e8fa;
      padding: 15px;
      border-radius: 14px;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.5;
    }

    .suggestion:hover {
      border-color: #8c6bff;
      background: #191b36;
    }

    #chat {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 25px;
    }

    .message {
      padding: 16px;
      border-radius: 16px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-size: 15px;
    }

    .user {
      background: #29234c;
      border: 1px solid #484075;
      align-self: flex-end;
      max-width: 90%;
    }

    .assistant {
      background: #121529;
      border: 1px solid #292d49;
      align-self: stretch;
    }

    .message-label {
      font-size: 12px;
      font-weight: bold;
      color: #a99aff;
      margin-bottom: 8px;
    }

    .composer {
      position: sticky;
      bottom: 0;
      background: #090b18;
      padding: 12px 0 8px;
      margin-top: auto;
    }

    .input-box {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #121529;
      border: 1px solid #343858;
      border-radius: 18px;
      padding: 10px;
    }

    textarea {
      flex: 1;
      width: 100%;
      min-width: 0;
      resize: vertical;
      max-height: 180px;
      min-height: 48px;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font: inherit;
      padding: 12px 7px;
    }

    textarea::placeholder {
      color: #8589a8;
    }

    #send {
      border: none;
      border-radius: 13px;
      min-width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #8b5cf6, #426bff);
      color: white;
      font-size: 21px;
      cursor: pointer;
    }

    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      color: #777d9d;
      font-size: 11px;
    }

    .small-button {
      background: transparent;
      border: 1px solid #343858;
      color: #c6c8df;
      border-radius: 9px;
      padding: 8px 11px;
      cursor: pointer;
    }

    #notice {
      color: #ffb6b6;
      font-size: 13px;
      line-height: 1.5;
      margin: 10px 2px;
      white-space: pre-wrap;
    }

    footer {
      text-align: center;
      padding: 18px 12px;
      color: #6f7491;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      header {
        padding: 14px;
      }

      .brand {
        font-size: 18px;
      }

      .status {
        font-size: 10px;
      }

      main {
        padding: 18px 13px;
      }

      .welcome {
        margin: 24px 0;
      }

      .suggestions {
        gap: 8px;
      }

      .suggestion {
        padding: 12px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <div class="logo">✦</div>
      <span>Nexora AI</span>
    </div>
    <div class="status">● AI Assistant</div>
  </header>

  <main>
    <section class="welcome" id="welcome">
      <h1>Hello, welcome to Nexora.</h1>
      <p>
        Your AI assistant for ideas, learning, writing and creativity.
        <br>What would you like to explore today?
      </p>
    </section>

    <section class="suggestions" id="suggestions">
      <button class="suggestion"
        data-prompt="Give me 5 creative ideas for a TikTok video.">
        ✨ Creative ideas<br>Find inspiration for your next video.
      </button>

      <button class="suggestion"
        data-prompt="Explain a difficult topic in simple English with examples.">
        📚 Learn something<br>Understand a topic step by step.
      </button>

      <button class="suggestion"
        data-prompt="Write a short, emotional story with a surprising ending.">
        ✍️ Write a story<br>Create an interesting new story.
      </button>

      <button class="suggestion"
        data-prompt="Give me a practical plan for starting an online project for free.">
        🚀 Build an idea<br>Plan your next project.
      </button>
    </section>

    <section id="chat" aria-live="polite"></section>
    <div id="notice" role="alert"></div>

    <section class="composer">
      <form id="chatForm">
        <div class="input-box">
          <textarea
            id="prompt"
            placeholder="Ask Nexora AI anything..."
            rows="1"
            required
            aria-label="Your message"
          ></textarea>

          <button id="send" type="submit" aria-label="Send message">
            ↑
          </button>
        </div>
      </form>

      <div class="tools">
        <span>Enter to send · Shift + Enter for a new line</span>
        <button class="small-button" id="clear" type="button">
          New chat ↻
        </button>
      </div>
    </section>
  </main>

  <footer>
    Nexora AI · Powered by Gemini
  </footer>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("prompt");
    const sendButton = document.getElementById("send");
    const chat = document.getElementById("chat");
    const notice = document.getElementById("notice");
    const welcome = document.getElementById("welcome");
    const suggestions = document.getElementById("suggestions");
    const clearButton = document.getElementById("clear");

    let busy = false;

    function addMessage(label, text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;

      const heading = document.createElement("div");
      heading.className = "message-label";
      heading.textContent = label;

      const content = document.createElement("div");
      content.textContent = text;

      message.appendChild(heading);
      message.appendChild(content);
      chat.appendChild(message);

      message.scrollIntoView({
        behavior: "smooth",
        block: "end"
      });

      return content;
    }

    async function askNexoraAI(prompt) {
      const response = await fetch(
        "/.netlify/functions/generate",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt: prompt })
        }
      );

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.error || "The AI request failed. Please try again."
        );
      }

      if (!data.answer) {
        throw new Error("The AI returned an empty answer. Try again.");
      }

      return data.answer;
    }

    async function sendPrompt(prompt) {
      if (busy || !prompt.trim()) return;

      busy = true;
      sendButton.disabled = true;
      input.disabled = true;
      notice.textContent = "";
      welcome.style.display = "none";
      suggestions.style.display = "none";

      addMessage("YOU", prompt, "user");

      const answerBox = addMessage(
        "NEXORA AI",
        "Thinking...",
        "assistant"
      );

      try {
        const answer = await askNexoraAI(prompt);
        answerBox.textContent = answer;
      } catch (error) {
        answerBox.textContent = "Sorry, I could not complete that request.";
        notice.textContent =
          "Error: " + error.message +
          "\nCheck your Netlify deployment and Gemini API configuration.";
      } finally {
        busy = false;
        sendButton.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const prompt = input.value.trim();
      if (!prompt) return;

      input.value = "";
      sendPrompt(prompt);
    });

    input.addEventListener("keydown", function(event) {
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    suggestions.querySelectorAll("button").forEach(function(button) {
      button.addEventListener("click", function() {
        const prompt = button.dataset.prompt;
        sendPrompt(prompt);
      });
    });

    clearButton.addEventListener("click", function() {
      if (busy) return;

      chat.replaceChildren();
      notice.textContent = "";
      welcome.style.display = "";
      suggestions.style.display = "";
      input.value = "";
      input.focus();
    });
  </script>
</body>
</html>
